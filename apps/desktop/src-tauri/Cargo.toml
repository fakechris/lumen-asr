[package]
name = "lumen-asr-desktop"
default-run = "lumen-asr-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lumen ASR desktop shell (Tauri)"

[build-dependencies]
ico = "0.5"
tauri-build = { version = "2", features = [] }
chrono = { workspace = true }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lumen-platform = { workspace = true }
lumen-store = { workspace = true }
lumen-core = { workspace = true }
lumen-meeting = { workspace = true }
lumen-identity = { workspace = true }
lumen-dictionary = { workspace = true }
lumen-asr = { workspace = true }
lumen-corrector = { workspace = true }
lumen-prompts = { workspace = true }
lumen-transcript = { workspace = true }
lumen-inject = { workspace = true }
lumen-platform-macos = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
cpal = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json"] }
blake3 = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
security-framework-sys = "2.17"
# For reading the capsule window's NSView so we can tune its NSWindow (e.g. show
# on all Spaces). Must match Tauri 2's raw-window-handle 0.6.
raw-window-handle = "0.6"
lumen-context = { workspace = true }
# Enable the real on-device diarization path only on macOS (diar-rs -> ONNX
# Runtime + C++). The base dependency above stays feature-free, so non-macOS
# builds compile the meeting pipeline's Unsupported stub instead.
lumen-meeting = { workspace = true, features = ["diarize"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Security_Authorization_AppCapabilityAccess",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"

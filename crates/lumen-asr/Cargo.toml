[package]
name = "lumen-asr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mic capture + product glue over the shared lumen-suite ASR crates"

[dependencies]
# Shared cluster crates (engines + model management). `cloud` enables the
# OpenAI-compatible HTTP engine that this product always offered.
lumen-asr-engine = { workspace = true, features = ["cloud"] }
lumen-models = { workspace = true }
cpal = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
# Standard WAV reader used only to assert that a crash-recovered file is
# readable by an off-the-shelf decoder (already in the workspace lockfile).
hound = "3"

[features]
default = ["sherpa"]
# Offline SenseVoice / Whisper via sherpa-onnx (downloads a prebuilt static
# lib on first build). Forwarded to the shared engine crate.
sherpa = ["lumen-asr-engine/sherpa"]

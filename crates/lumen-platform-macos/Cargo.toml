[package]
name = "lumen-platform-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "macOS: permissions, paste-first inject, AX/type fallbacks"

[dependencies]
async-trait = { workspace = true }
lumen-core = { workspace = true }
lumen-edit-learning = { workspace = true }
lumen-inject = { workspace = true }
lumen-platform = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
chrono = { workspace = true }
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSValue", "NSNotification", "NSOperation", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSWorkspace", "NSRunningApplication"] }
block2 = "0.6"
tokio = { workspace = true }

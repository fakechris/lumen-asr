[workspace]
resolver = "2"
members = [
  "crates/lumen-core",
  "crates/lumen-asr",
  "crates/lumen-corrector",
  "crates/lumen-dictionary",
  "crates/lumen-store",
  "crates/lumen-meeting",
  "crates/lumen-inject",
  "crates/lumen-platform",
  "crates/lumen-platform-macos",
  "crates/lumen-prompts",
  "apps/desktop/src-tauri",
]
default-members = [
  "crates/lumen-core",
  "crates/lumen-asr",
  "crates/lumen-corrector",
  "crates/lumen-dictionary",
  "crates/lumen-store",
  "crates/lumen-meeting",
  "crates/lumen-inject",
  "crates/lumen-platform",
  "crates/lumen-prompts",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/fakechris/lumen-asr"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "stream"], default-features = false }
regex = "1"
toml = "0.8"

lumen-core = { path = "crates/lumen-core" }
lumen-asr = { path = "crates/lumen-asr" }
lumen-corrector = { path = "crates/lumen-corrector" }
lumen-dictionary = { path = "crates/lumen-dictionary" }
lumen-store = { path = "crates/lumen-store" }
lumen-meeting = { path = "crates/lumen-meeting" }
lumen-inject = { path = "crates/lumen-inject" }
lumen-platform = { path = "crates/lumen-platform" }
lumen-platform-macos = { path = "crates/lumen-platform-macos" }
lumen-prompts = { path = "crates/lumen-prompts" }
# Versioned capture contracts shared with Lumen's local macOS context collector.
lumen-context = { git = "https://github.com/fakechris/lumen-suite.git", rev = "8719c032f6dc5dbc8c16c694150517547d623131" }
# Shared model path/lock/download layer and ASR engine layer for the Lumen
# product cluster (replaces the former in-repo paths/install_lock/engine code).
lumen-models = { git = "https://github.com/fakechris/lumen-suite.git", rev = "8719c032f6dc5dbc8c16c694150517547d623131" }
lumen-asr-engine = { git = "https://github.com/fakechris/lumen-suite.git", rev = "8719c032f6dc5dbc8c16c694150517547d623131", default-features = false }
# Shared serde types for the lumen-transcript.v1 interchange format.
lumen-transcript = { git = "https://github.com/fakechris/lumen-suite.git", rev = "8719c032f6dc5dbc8c16c694150517547d623131" }
parking_lot = "0.12"
cpal = "0.15"
blake3 = "1"
